<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | AutoMaster Pro</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><div class="login-box"><div class="login-logo">🚗</div><h1>AutoMaster Pro</h1><p>ورود به سیستم مدیریت خودرو و تعمیرگاه</p><label>نام کاربری</label><input id="username" autocomplete="username"><label>رمز عبور</label><div class="pass"><input id="password" type="password" autocomplete="current-password"><button onclick="togglePassword()">👁</button></div><button class="login-btn" onclick="login()">ورود به سیستم</button><small id="error"></small><div class="demo">نسخه آزمایشی: admin / admin123</div></div><script>function togglePassword(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'}function login(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,e=document.getElementById('error');if(u==='admin'&&p==='admin123'){sessionStorage.setItem('automaster_login','1');location.href='index.html'}else{e.textContent='نام کاربری یا رمز عبور اشتباه است.'}}</script></body></html>
